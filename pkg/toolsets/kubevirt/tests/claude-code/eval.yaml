kind: Eval
metadata:
  name: "kubevirt-vm-operations"
config:
  agentFile: agent.yaml
  mcpConfigFile: ../mcp-config.yaml
  taskSets:
    - glob: ../tasks/*/*.yaml
      assertions:
        toolsUsed:
          - server: kubernetes
            toolPattern: "(vm_create|vm_troubleshoot|vm_start|vm_stop|vm_pause|resources_.*)"
        minToolCalls: 1
        maxToolCalls: 30
