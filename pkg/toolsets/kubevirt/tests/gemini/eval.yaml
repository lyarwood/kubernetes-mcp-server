kind: Eval
metadata:
  name: "gemini-cli-kubernetes-basic-operations"
config:
  agentFile: agent.yaml
  mcpConfigFile: ../mcp-config.yaml
  taskSets:
    - glob: ../tasks/*/*.yaml
      assertions:
        toolsUsed:
          - server: kubernetes
            toolPattern: ".*"
        minToolCalls: 1
        maxToolCalls: 20
